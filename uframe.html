<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
let __glbPromise = null;
window.__toGlb = function() {
  if (!__glbPromise) __glbPromise = (async () => {
    const b64 = document.getElementById('model-data').textContent.trim();
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    let object;
    const text = new TextDecoder().decode(bytes);
    const objLoader = new OBJLoader();
    const mtlB64 = document.getElementById('model-mtl').textContent.trim();
    const mtlBin = atob(mtlB64);
    const mtlBytes = new Uint8Array(mtlBin.length);
    for (let i = 0; i < mtlBin.length; i++) mtlBytes[i] = mtlBin.charCodeAt(i);
    const mtlText = new TextDecoder().decode(mtlBytes);
    const materials = new MTLLoader().parse(mtlText, '');
    materials.preload();
    objLoader.setMaterials(materials);
    object = objLoader.parse(text);
  object.traverse((child) => {
    if (!child.isMesh) return;
    const toStandard = (mat) => (mat && mat.isMeshPhongMaterial)
      ? new THREE.MeshStandardMaterial({ color: mat.color, opacity: mat.opacity, transparent: mat.transparent, side: mat.side, map: mat.map || null })
      : mat;
    child.material = Array.isArray(child.material) ? child.material.map(toStandard) : toStandard(child.material);
  });
    const exporter = new GLTFExporter();
    const glb = await new Promise((res, rej) => exporter.parse(object, res, rej, { binary: true }));
    return new Uint8Array(glb);
  })();
  return __glbPromise;
};
</script>

<script type="module">
const glb = await window.__toGlb();
const blob = new Blob([glb], { type: 'model/gltf-binary' });
document.getElementById('mv').src = URL.createObjectURL(blob);
const __dlGlbBtn = document.getElementById('dl-glb');
__dlGlbBtn.addEventListener('click', async () => {
  __dlGlbBtn.disabled = true;
  const __dlGlbLabel = __dlGlbBtn.textContent;
  __dlGlbBtn.textContent = 'Converting...';
  try {
    const glb = await window.__toGlb();
    const blob = new Blob([glb], { type: 'model/gltf-binary' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'uframe.glb';
    a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    console.error('GLB export failed', err);
    alert('GLB export failed: ' + err.message);
  } finally {
    __dlGlbBtn.disabled = false;
    __dlGlbBtn.textContent = __dlGlbLabel;
  }
});
</script>
