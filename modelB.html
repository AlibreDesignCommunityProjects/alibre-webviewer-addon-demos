<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
window.__toGlb = async function() {
  const b64 = document.getElementById('model-data').textContent.trim();
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  let object;
  const text = new TextDecoder().decode(bytes);
  object = new OBJLoader().parse(text);
  const exporter = new GLTFExporter();
  const glb = await new Promise((res, rej) => exporter.parse(object, res, rej, { binary: true }));
  return new Uint8Array(glb);
};
</script>

<script type="module">
const glb = await window.__toGlb();
const blob = new Blob([glb], { type: 'model/gltf-binary' });
document.getElementById('mv').src = URL.createObjectURL(blob);
</script>
