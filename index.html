<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alibre WebViewer Demo Gallery</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --border: #dfe2e6;
    --text: #1c1f24;
    --text-muted: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --ok: #16a34a;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 24px 64px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 28px;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 6px;
  }
  header p {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.5;
    margin: 4px 0;
  }
  header p.credit {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 13px;
  }
  header p.credit a {
    color: var(--accent);
    text-decoration: none;
  }
  header p.credit a:hover {
    text-decoration: underline;
  }
  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card-head {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .card-head .name {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    word-break: break-all;
  }
  .card-head a {
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
    white-space: nowrap;
  }
  .card-head a:hover { text-decoration: underline; }
  .frame-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: repeating-conic-gradient(#eee 0% 25%, #f7f7f7 0% 50%) 50% / 20px 20px;
  }
  .frame-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .controls {
    padding: 10px 14px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    border-top: 1px solid var(--border);
  }
  .controls label {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .controls input[type="number"] {
    width: 64px;
    padding: 3px 6px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 12px;
  }
  .spacer { flex: 1; }
  button.copy-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  button.copy-btn:hover { background: var(--accent-hover); }
  button.copy-btn.copied { background: var(--ok); }
  code.snippet {
    display: none;
  }
</style>
</head>
<body>

<header>
  <h1>alibre-webviewer-addon iframe/embed tester</h1>
  <p class="credit">Part of <a href="https://github.com/AlibreDesignCommunityProjects/alibre-webviewer-addon" target="_blank" rel="noopener">alibre-webviewer-addon</a>. By <a href="https://github.com/stephensmitchell" target="_blank" rel="noopener">Stephen S. Mitchell</a>.</p>
</header>

<div class="grid" id="grid"></div>

<script>
  const files = [
    "Alibre-logo-0-viewer.html",
    "Alibre-logo-2-viewer.html",
    "Alibre-logo-viewer.html",
    "deck_stairs-viewer.html",
    "deck_twolevel-viewer.html",
    "design-lofted-duct-viewer.html",
    "flange-viewer.html",
    "modelA.html",
    "modelB.html",
    "modelC.html",
    "model.html",
    "model2.html",
    "model3.html",
    "model4.html",
    "model5.html",
    "model00.html",
    "model-55.html",
    "newapi-06-sheet-gusset-viewer2.html",
    "newcap-01-hss-tube-viewer.html",
    "newcap-04-perforated-plate-viewer.html",
    "sample_deck-viewer.html",
    "sheep-viewer.html",
    "steel-wbeam-helix-2turn-viewer.html",
    "steel-wbeam-helix-2turn-viewer2.html",
    "wbeam-helix-plumb-viewer.html"
  ];

  const grid = document.getElementById("grid");

  files.forEach((file, i) => {
    const url = new URL(file, document.baseURI).href;
    const defaultHeight = 600;

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="card-head">
        <span class="name">${file}</span>
        <a href="${file}" target="_blank" rel="noopener">Open standalone ↗</a>
      </div>
      <div class="frame-wrap">
        <iframe src="${file}" title="${file}" loading="lazy"></iframe>
      </div>
      <div class="controls">
        <label>Height <input type="number" class="height-input" value="${defaultHeight}" min="100" step="50"></label>
        <label>Width <input type="text" class="width-input" value="100%"></label>
        <span class="spacer"></span>
        <button class="copy-btn" data-file="${file}">Copy iframe code</button>
      </div>
    `;

    grid.appendChild(card);

    const btn = card.querySelector(".copy-btn");
    const heightInput = card.querySelector(".height-input");
    const widthInput = card.querySelector(".width-input");

    btn.addEventListener("click", async () => {
      const h = heightInput.value.trim() || String(defaultHeight);
      const w = widthInput.value.trim() || "100%";
      const snippet = `<iframe src="${url}" width="${w}" height="${h}" style="border:0;" allow="fullscreen" allowfullscreen loading="lazy" title="${file}"></iframe>`;

      try {
        await navigator.clipboard.writeText(snippet);
      } catch (err) {
        const ta = document.createElement("textarea");
        ta.value = snippet;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }

      const original = btn.textContent;
      btn.textContent = "Copied!";
      btn.classList.add("copied");
      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove("copied");
      }, 1500);
    });
  });
</script>

</body>
</html>
