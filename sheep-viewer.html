<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
const b64 = document.getElementById('model-data').textContent.trim();
const bin = atob(b64);
const bytes = new Uint8Array(bin.length);
for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
const canvas = document.getElementById('viewer');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#1e1e1e');
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100000);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(1, 1, 1); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.4); fill.position.set(-1, -0.5, -1); scene.add(fill);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
const loader = new OBJLoader();
let object;
      const text = new TextDecoder().decode(bytes);
      object = loader.parse(text);
scene.add(object);
const box = new THREE.Box3().setFromObject(object);
const size = box.getSize(new THREE.Vector3());
const center = box.getCenter(new THREE.Vector3());
object.position.sub(center);
const radius = Math.max(size.x, size.y, size.z) || 1;
camera.position.set(radius * 1.5, radius * 1.2, radius * 1.8);
camera.near = radius / 100; camera.far = radius * 100; camera.updateProjectionMatrix();
controls.target.set(0, 0, 0);
function resize(){ const w = canvas.clientWidth, h = canvas.clientHeight; if (canvas.width !== w || canvas.height !== h){ renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); } }
function animate(){ requestAnimationFrame(animate); resize(); controls.update(); renderer.render(scene, camera); }
animate();
</script>
